# AI가 놓친 문제 9개. route는 문제가 드러난 경로다.
# 프로젝트 연결은 기준 페이지에 없어 넣지 않았다.
- route: 실기기 테스트
  problem: 여러 명이 동시에 누른 「완료」 중 항상 한 명이 누락됐습니다.
  cause: 상태를 나눠 저장하는 사이 다른 요청이 앞선 액션을 덮어썼습니다.
  prevention: 한 트랜잭션 RPC로 합치고, 이 경로만 쓰도록 프로젝트 규칙에 추가했습니다.

- route: 실기기 테스트
  problem: 마피아 역할 확인 화면이 손을 떼도 계속 보였습니다.
  cause: 누르는 순간 뷰가 바뀌어 손을 뗀 이벤트가 전달되지 않을 수 있었습니다.
  prevention: 터치 처리를 고정하고 터치 종료와 취소 모두에서 가리도록 했습니다.

- route: 실기기 테스트
  problem: 갤럭시와 웹에서 음성 내레이션이 나오지 않았습니다.
  cause: Android TTS에 언어 코드 대신 ko-KR을 넘겨 소리 없이 실패할 수 있었습니다.
  prevention: 플랫폼별 값을 분리하고 설정에 음성 확인 기능을 추가했습니다.

- route: 배포본 플레이
  problem: 이벤트 선택지 문구만으로 어떤 행동인지 읽히지 않았습니다.
  cause: 당시 라벨 12자 규칙 아래 목적어가 생략됐습니다.
  prevention: 대상과 동사를 필수로 하는 작성 규칙을 에이전트 기억에 남겼습니다.

- route: 측정 모델 점검
  problem: 전투를 한 번도 하지 않고 완주할 수 있었습니다.
  cause: 시뮬레이션 정책이 회피 플레이를 다루지 않아 평균값이 하한처럼 보였습니다.
  prevention: 전투 최소 3회를 구조로 보장하고 복수 정책 시뮬레이션을 요구했습니다.

- route: 결과값 이상
  problem: 단타 신호가 장중에 항상 0건이었습니다.
  cause: 장중 거래량을 전일 하루 전체와 비교했고, 지연된 오늘 봉을 읽었습니다.
  prevention: 경과 시간으로 기준을 안분하고 실시간 값과 과거 기준선을 분리했습니다.

- route: 결과값 이상
  problem: 암호화폐 백테스트 적중률이 0%로 표시됐습니다.
  cause: 평가 구간이 짧고 목표가 높았으며, 신호 없음이 숨은 값으로 처리됐습니다.
  prevention: 기간과 기준을 고치고 신호 없음을 별도 상태로 표시했습니다.

- route: 테스트 작성
  problem: 자정을 넘기는 일정을 복제하면 종료 시각이 시작보다 빨라졌습니다.
  cause: 첫 구현이 종료 시각을 시작과 같은 날짜에 두었습니다.
  prevention: 날짜 이동을 순수 함수로 분리하고 서머타임 경우까지 테스트로 고정했습니다.

- route: 데이터 확인
  problem: 밴쿠버 여행이 뉴욕 시간대로 저장돼 있었습니다.
  cause: 시간대를 직접 고르는 입력에 브라우저 기본값이 그대로 남았습니다.
  prevention: 장소를 고르면 좌표에서 시간대를 계산해 함께 저장합니다.
