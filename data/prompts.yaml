# 프롬프트 기법 9개. quote는 명세와 규칙 파일에 실제로 남긴 지시문이다.
intro: 명세와 규칙 파일에 실제로 남긴 지시문입니다.
source: 출처는 저장소의 SPEC.md, CLAUDE.md, 에이전트 기억 파일입니다. 대화 전체 기록은 포함하지 않았습니다.
items:
  - title: 작업 크기 제한
    quote: 한 번에 전부 만들라고 하지 말고 Phase 단위로 진행
    why: 큰 요청을 검증 가능한 단위로 나눕니다.
  - title: 결정 고정
    quote: 바꿀 거면 시작 전에 물어보고 바꿀 것. 중간에 바꾸지 말 것.
    why: 에이전트가 임의로 기술 스택을 바꾸지 못하게 합니다.
  - title: 실패 방식 금지
    quote: 하드코딩된 더미 데이터로 화면만 그리지 말고
    why: 그럴듯해 보이는 결과물을 사전에 차단합니다.
  - title: 선택지형 질문
    quote: 열린 질문("어떻게 할까요?")은 금지
    why: A/B/C로 묻게 해 판단 비용을 줄입니다.
  - title: 역할 경계
    quote: 새로운 피처 코드를 직접 개발하지 마십시오.
    why: QA 에이전트가 테스트와 디버깅에만 집중합니다.
  - title: 지시보다 강제
    quote: 프롬프트 지시가 아니라 강제다.
    why: 타입 검사는 훅으로, 위험 명령은 권한 설정으로 막습니다.
  - title: 컨텍스트 절약
    quote: 코드는 절대 채팅에 붙여넣지 않는다.
    why: 보고 형식을 제한하고 긴 조사는 서브에이전트에게 넘깁니다.
  - title: 작은 샘플 먼저
    quote: 첫 제출은 항상 샘플 1편만 실물로 쓰고
    why: 승인 전 대량 생성으로 낭비하지 않게 합니다.
  - title: 검증 범위 공개
    quote: '"확인 안 됨: 실제 브라우저 클릭 조작"으로 명시하고 얼버무리지 않는다'
    why: 확인하지 않은 것을 확인했다고 보고하지 못하게 합니다.
