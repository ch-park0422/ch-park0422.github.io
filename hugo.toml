  description = '10년 동안 게임, 금융, 블록체인, AI 서비스의 품질을 맡아 온 QA Engineer 박창현의 포트폴리오와 블로그입니다.'
  jobTitle = 'QA Engineer'
  worksFor = 'KT'
  github = 'https://github.com/ch-park0422'
  image = 'images/profile.jpg'
