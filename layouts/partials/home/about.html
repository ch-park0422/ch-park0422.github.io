{{ $hero := hugo.Data.hero }}
<section id="about" class="about">
  <div>
    <p class="eyebrow">... /About ...</p>
    <h2>{{ delimit $hero.about.title "<br>" | safeHTML }}</h2>
    <div class="copy">
      {{ range $hero.about.copy }}<p>{{ . }}</p>{{ end }}
    </div>
  </div>
  <div class="bars">
    <h3>주요 도구</h3>
    <div class="pills">{{ range $hero.tools }}<span>{{ . }}</span>{{ end }}</div>
    <small>기능, 성능, 자동화 QA에서 사용한 도구입니다.</small>
  </div>
</section>
