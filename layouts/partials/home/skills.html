<section id="skills">
  <div class="head"><p class="path">... /Skills ...</p><h2>QA Engineering과 PM 역량</h2></div>
  <div class="skills">
    {{ range hugo.Data.skills.qa }}
    <div class="skill">
      <span class="ico">{{ partial "icon.html" .icon }}</span>
      <h3>{{ .title }}</h3>
      <ul>{{ range .items }}<li>{{ . }}</li>{{ end }}</ul>
      <p class="from">근거: {{ delimit .from " · " }}</p>
    </div>
    {{ end }}
  </div>
</section>
